html,body{width:1316px;height:620px;overflow:hidden;background:#F5EFE3}

.field{position:absolute;inset:0}
.cluster{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center}
.lockup{white-space:nowrap;color:#F5EFE3;line-height:1}
.lockup .lat{font-family:"Anton",sans-serif;font-size:124px;letter-spacing:-2px}

.tagwrap{position:absolute;left:50%;top:64%;transform:translateX(-50%) rotate(-8deg);z-index:3}

.tag{position:relative;background:#C6D936;color:#23206E;border-radius:8px;padding:7px 18px 9px;text-align:center;box-shadow:0 0 26px 8px rgba(198,217,54,.5),0 8px 18px rgba(20,18,70,.45)}
.tag .g1{font-family:"Mukta Vaani",sans-serif;font-weight:700;font-size:29px;line-height:1.05}
.tag .g2{font-family:"Anton",sans-serif;font-size:19px;letter-spacing:5px;line-height:1.2}
.tag::before,.tag::after{content:"";position:absolute;top:5px;width:5px;height:5px;border-radius:50%;background:rgba(35,32,110,.55)}
.tag::before{left:6px}.tag::after{right:6px}
.flank{position:absolute;top:59%;font-family:"Anton",sans-serif;font-size:16px;letter-spacing:3px;color:#F5EFE3}
.flank.l{left:20.5%}
.flank.r{right:20.5%}
.track{position:absolute;left:0;top:0;z-index:1}
